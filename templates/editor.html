{% extends 'base.html' %}{% block title %}{{ heading }} · 知页{% endblock %}
{% block content %}<div class="content-page editor-page"><div class="backline"><a href="{{ url_for('note_detail', id=note.id) if note else url_for('home') }}">← 返回</a><span>笔记编辑器</span></div><div class="page-heading compact"><div><span class="eyebrow">CAPTURE YOUR IDEAS</span><h1>{{ heading }}</h1><p>将灵感、知识和思考写下来。</p></div></div><form method="post" class="editor-card" data-draft-key="{{ 'note-'+note.id|string if note else 'new-note' }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="title">标题 <span class="required">*</span></label><input class="title-input" id="title" name="title" maxlength="200" required autofocus value="{{ note.title if note else request.form.get('title','') }}" placeholder="给这篇笔记起个名字"><label for="tags">标签</label><input id="tags" name="tags" value="{{ note.tags or '' if note else request.form.get('tags','') }}" placeholder="例如：学习, 灵感, 项目（用逗号分隔）"><label for="content">正文</label><textarea id="content" name="content" rows="16" placeholder="在这里写下你的想法...">{{ note.content if note else request.form.get('content','') }}</textarea><div class="editor-bottom"><label class="checkbox-line"><input type="checkbox" name="is_pinned" value="1" {{ 'checked' if note and note.is_pinned else '' }}> 置顶这篇笔记</label><span class="muted" id="draft-status">输入内容会暂存在此浏览器</span></div><div class="editor-actions"><a class="button secondary" href="{{ url_for('note_detail', id=note.id) if note else url_for('home') }}">取消</a><button class="button primary" type="submit">保存笔记 →</button></div></form></div>{% endblock %}
