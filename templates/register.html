{% extends 'base.html' %}{% block title %}注册 · 知页{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-story"><span class="eyebrow">BEGIN YOUR JOURNEY</span><h1>从今天开始，<br><em>记录每一步。</em></h1><p>你的知识库，从第一篇笔记开始生长。</p><div class="auth-illustration" aria-hidden="true"><span>✳</span><span>✦</span><span>⌁</span></div></div><div class="auth-card"><div class="card-icon">✳</div><h2>创建账号</h2><p class="muted">给自己的想法一个家</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="50" required placeholder="3–50 个字符"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="至少 8 个字符"><button class="button primary full" type="submit">创建账号 <span>→</span></button></form><p class="auth-switch">已有账号？ <a href="{{ url_for('login') }}">返回登录</a></p></div></section>{% endblock %}
