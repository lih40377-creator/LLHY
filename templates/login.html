{% extends 'base.html' %}{% block title %}登录 · 知页{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-story"><span class="eyebrow">YOUR SPACE FOR THINKING</span><h1>每一个想法，<br><em>都值得被记住。</em></h1><p>把学习、灵感与日常收进自己的笔记空间。随时记录，轻松整理，继续向前。</p><div class="auth-illustration" aria-hidden="true"><span>✳</span><span>✦</span><span>⌁</span></div></div><div class="auth-card"><div class="card-icon">✳</div><h2>欢迎回来</h2><p class="muted">登录后继续整理你的笔记</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required autofocus placeholder="请输入用户名"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"><button class="button primary full" type="submit">进入工作台 <span>→</span></button></form><p class="auth-switch">还没有账号？ <a href="{{ url_for('register') }}">立即注册</a></p></div></section>{% endblock %}
