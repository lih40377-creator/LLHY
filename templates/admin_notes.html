{% extends 'base.html' %}{% block title %}管理笔记 · 知页{% endblock %}
{% block content %}<div class="content-page"><div class="page-heading compact"><div><span class="eyebrow">ALL NOTES</span><h1>笔记管理</h1><p>查看和维护站点内的笔记。</p></div></div><form class="filterbar" method="get"><label class="search-input"><span>⌕</span><input name="keyword" value="{{ request.args.get('keyword','') }}" placeholder="搜索所有笔记"></label><select name="view"><option value="active">当前笔记</option><option value="archived" {{ 'selected' if request.args.get('view') == 'archived' else '' }}>已归档</option><option value="all" {{ 'selected' if request.args.get('view') == 'all' else '' }}>全部</option></select><button class="button secondary">筛选</button></form><div class="section-heading"><h2>笔记列表</h2><span>{{ notes|length }} 篇</span></div><div class="result-list">{% for note in notes %}<div class="result-row"><span class="note-icon">✳</span><span><a href="{{ url_for('note_detail', id=note.id) }}"><strong>{{ note.title }}</strong></a><small>用户 #{{ note.user_id }} · {{ note.create_time.strftime('%Y.%m.%d') }}</small></span><a class="button secondary small" href="{{ url_for('edit', id=note.id) }}">编辑</a><form method="post" action="{{ url_for('delete', id=note.id) }}" data-confirm="确定删除这篇笔记吗？"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="button danger small">删除</button></form></div>{% else %}<div class="empty-state">暂无笔记</div>{% endfor %}</div></div>{% endblock %}
