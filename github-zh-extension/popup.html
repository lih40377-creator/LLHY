<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 界面中文助手</title>
  <style>
    body { box-sizing: border-box; width: 300px; margin: 0; padding: 18px; color: #24292f; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 12px; font-size: 17px; }
    .switch { display: flex; align-items: center; gap: 9px; font-weight: 600; }
    input[type="checkbox"] { width: 17px; height: 17px; accent-color: #2da44e; }
    label[for="preserved"] { display: block; margin: 16px 0 5px; font-weight: 600; }
    textarea { box-sizing: border-box; width: 100%; height: 124px; padding: 9px; resize: vertical; border: 1px solid #d0d7de; border-radius: 6px; font: 13px/1.45 system-ui, sans-serif; }
    p { margin: 7px 0 0; color: #57606a; font-size: 12px; }
    #status { min-height: 17px; color: #1a7f37; }
  </style>
</head>
<body>
  <h1>GitHub 界面中文助手</h1>
  <label class="switch"><input id="enabled" type="checkbox">开启界面翻译</label>
  <label for="preserved">保持英文的界面项</label>
  <textarea id="preserved" spellcheck="false" aria-describedby="help"></textarea>
  <p id="help">每行写一个完整的英文按钮或菜单名。Git、PR、issue 等专业词在默认译文中也会保留英文。</p>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
